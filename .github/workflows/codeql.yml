name: CodeQL

# NOTE ON GENERATED-CODE FINDINGS (owner-directed, 2026-11-15):
# AGP data-binding classes under app/build/ are generated by every Gradle
# build, are not committed to this repository, and cannot be fixed at
# source. Five documented CodeQL exclusion mechanisms were tried; none
# filters a traced java-kotlin database (details in
# .github/scripts/filter-generated-sarif.js). Per the owner's direction,
# findings whose primary location is under app/build/ are removed from the
# SARIF before upload. The filter is deliberately narrow (app/build/
# prefix only) and first-party findings must keep flowing — the pipeline
# is proven to report real findings (RootChecker.kt findings were reported
# and closed by a code fix). Never widen the filter.

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "27 4 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'oracle'

      - name: Set Executable Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended, security-and-quality

      - name: Build
        run: ./gradlew assembleDebug --no-daemon

      - name: Perform CodeQL Analysis (write SARIF, no upload yet)
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          output: ../sarif
          upload: false

      - name: Filter AGP-generated-code findings out of SARIF
        run: node .github/scripts/filter-generated-sarif.js ../sarif

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ../sarif
          category: "/language:${{ matrix.language }}"
